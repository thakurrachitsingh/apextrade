spring.application.name=apextrade
server.port=${PORT:8080}

spring.threads.virtual.enabled=true

apextrade.jwt.secret=${APEXTRADE_JWT_SECRET}
apextrade.jwt.expiration-ms=86400000

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

apextrade.engine.host=${APEXTRADE_ENGINE_HOST:localhost}
apextrade.engine.port=${APEXTRADE_ENGINE_PORT:9000}
